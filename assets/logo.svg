<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" width="300" height="260" role="img" aria-labelledby="t">
  <title id="t">Periodic Table of Cyber Attacks</title>
  <style>
    .glass{fill:#ffffff;fill-opacity:.55;stroke:#2B4257;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
    .rim{fill:#2B4257}
    .shine{fill:none;stroke:#ffffff;stroke-width:5;stroke-linecap:round;opacity:.8}
    .tick{stroke:#2B4257;stroke-width:3;stroke-linecap:round}
    .bug{fill:#15283A}
    .bugl{stroke:#15283A;stroke-width:2.5;stroke-linecap:round;fill:none}
  </style>
  <defs>
    <clipPath id="flask">
      <path d="M104 64 V112 L48 206 Q41 220 58 222 H190 Q207 220 200 206 L144 112 V64 Z"/>
    </clipPath>
    <clipPath id="tube">
      <path d="M0 0 H26 V104 A13 13 0 0 1 0 104 Z"/>
    </clipPath>
  </defs>

  <rect width="300" height="260" rx="28" fill="#ffffff"/>

  <!-- rising tile bubbles above the flask -->
  <rect x="112" y="38" width="12" height="12" rx="3" fill="hsl(268 58% 62%)" transform="rotate(-12 118 44)"/>
  <rect x="132" y="16" width="10" height="10" rx="3" fill="hsl(12 62% 60%)" transform="rotate(14 137 21)"/>
  <rect x="114" y="0" width="8" height="8" rx="2" fill="hsl(200 58% 58%)" transform="rotate(-8 118 4)"/>

  <!-- flask -->
  <path class="glass" d="M104 64 V112 L48 206 Q41 220 58 222 H190 Q207 220 200 206 L144 112 V64 Z"/>
  <g clip-path="url(#flask)">
    <path d="M30 150 Q62 140 94 150 T158 150 T222 150 V230 H30 Z" fill="hsl(172 58% 52%)"/>
    <path d="M30 176 Q62 168 94 176 T158 176 T222 176 V230 H30 Z" fill="hsl(200 60% 50%)"/>
    <path d="M30 200 Q62 194 94 200 T158 200 T222 200 V230 H30 Z" fill="hsl(268 52% 52%)"/>
    <!-- tile bubbles in the liquid -->
    <rect x="76" y="186" width="13" height="13" rx="3" fill="hsl(42 70% 62%)" transform="rotate(10 82 192)"/>
    <rect x="150" y="190" width="11" height="11" rx="3" fill="hsl(350 62% 64%)" transform="rotate(-14 155 195)"/>
    <rect x="160" y="160" width="9" height="9" rx="2" fill="hsl(42 70% 66%)"/>
    <rect x="98" y="128" width="9" height="9" rx="2" fill="hsl(300 55% 64%)" transform="rotate(18 102 132)"/>
    <rect x="132" y="118" width="11" height="11" rx="3" fill="hsl(30 70% 62%)" transform="rotate(-10 137 123)"/>
    <!-- the bug -->
    <g transform="translate(118 176) rotate(-18)">
      <path class="bugl" d="M-9 -4 L-17 -9 M-10 2 L-19 2 M-9 8 L-17 13 M9 -4 L17 -9 M10 2 L19 2 M9 8 L17 13 M-3 -12 L-7 -19 M3 -12 L7 -19"/>
      <ellipse class="bug" cx="0" cy="3" rx="10" ry="13"/>
      <circle class="bug" cx="0" cy="-10" r="6"/>
    </g>
  </g>
  <path class="shine" d="M70 196 L102 140"/>
  <rect class="rim" x="94" y="56" width="60" height="12" rx="5"/>

  <!-- test tube -->
  <g transform="translate(232 90) rotate(14)">
    <g clip-path="url(#tube)">
      <rect x="-2" y="44" width="30" height="80" fill="hsl(142 55% 50%)"/>
      <rect x="6" y="88" width="8" height="8" rx="2" fill="hsl(142 60% 78%)"/>
      <rect x="13" y="66" width="6" height="6" rx="2" fill="hsl(142 60% 78%)"/>
    </g>
    <path class="glass" style="fill-opacity:0" d="M0 0 V104 A13 13 0 0 0 26 104 V0"/>
    <rect class="rim" x="-5" y="-8" width="36" height="10" rx="4"/>
    <path class="shine" d="M7 16 V56"/>
  </g>
  <!-- tube bubble -->
  <rect x="252" y="56" width="9" height="9" rx="2" fill="hsl(142 55% 55%)" transform="rotate(20 256 60)"/>
</svg>
